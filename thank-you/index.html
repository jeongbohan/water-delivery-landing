<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#1e63ff">
  <title>지원 접수 완료 | 배송인그룹</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:#eef5ff;color:#101828;font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;word-break:keep-all}.card{width:min(100%,520px);padding:42px 28px 34px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 20px 60px rgba(16,24,40,.12)}.logo{width:158px;height:auto}.check{width:68px;height:68px;display:grid;place-items:center;margin:30px auto 22px;border-radius:50%;background:#1e63ff;color:#fff;font-size:38px;font-weight:800}.card h1{margin:0;font-size:27px;line-height:1.3;letter-spacing:-1px}.card p{margin:13px 0 0;color:#667085;font-size:15px;line-height:1.65}.note{margin-top:25px;padding:15px;border-radius:12px;background:#f7f8fa;color:#344054;font-size:13px;line-height:1.6;font-weight:650}.back{display:inline-flex;align-items:center;justify-content:center;width:100%;height:56px;margin-top:24px;border-radius:12px;background:#1e63ff;color:#fff;text-decoration:none;font-size:16px;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../img/deliveryin-logo.png" alt="배송인그룹">
    <div class="check" aria-hidden="true">✓</div>
    <h1>지원 접수가 완료됐어요</h1>
    <p>입력해주신 내용을 확인한 뒤<br>담당자가 순차적으로 연락드릴게요.</p>
    <div class="note">업무 적합성 진단을 위한 유선상 인터뷰가 진행됩니다.</div>
    <a class="back" href="../direct/">지원 페이지로 돌아가기</a>
  </main>
</body>
</html>
